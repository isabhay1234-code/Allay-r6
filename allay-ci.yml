# ALLAY - single-file setup + CI (revision phase1-r6: ALLAY keyword only + resume state machine).
# Put this ONE file at .github/workflows/allay-ci.yml in your GitHub repo (replace the old one).
# Run it: it unpacks/updates the ALLAY project in your repo, then builds ONE debug APK.
# If the repo already has an older ALLAY, the project files are updated to this revision.
# No secrets, no signing. Only the first job can write to the repo.
name: ALLAY CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: allay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed only to add the project files on the first run
    steps:
      - uses: actions/checkout@v4

      - name: Unpack / update ALLAY project
        run: |
          set -e
          VERSION="phase1-r6"
          if [ -f .allay-payload-version ] && [ "$(cat .allay-payload-version)" = "$VERSION" ]; then
            echo "Project is already at $VERSION - nothing to unpack."
            exit 0
